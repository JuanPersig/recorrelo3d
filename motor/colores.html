<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colores medidos en las fotos</title>
<style>
/* Herramienta de desarrollo (T-22): propone para cada mueble y superficie el color medido en sus fotos. */
:root{ --bg:#eceef0; --ink:#1d2430; --muted:#5b6573; font-family:system-ui,"Segoe UI",sans-serif }
body{ margin:0; background:var(--bg); color:var(--ink); padding:12px 14px 40px }
h1{ font-size:18px; margin:0 0 4px } p{ margin:4px 0; color:var(--muted); font-size:13px }
table{ border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums } td,th{ padding:3px 8px; border-bottom:1px solid #d6dade; text-align:left }
.sw{ display:inline-block; width:34px; height:18px; border-radius:4px; vertical-align:middle; border:1px solid #0002 }
#stage{ position:fixed; left:-10000px; top:0; width:480px; height:640px } code{ font-size:12px }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<h1>Colores medidos en las fotos</h1>
<p id="estado">Midiendo…</p>
<div id="out"></div>
<div id="stage"></div>
<script type="module">
// colores.html?depto=<id>[&umbral=6]
// Mide cada vista con foto (mapa de identificación, T-21) y propone para cada objeto el color que haría que el render
// se parezca a la foto: color actual × (foto / render), en espacio lineal y por canal, descontando la exposición y el
// balance de blancos de cada foto (la mediana de foto / render de todos los objetos de esa vista, por canal). La
// corrección de un objeto se limita a × 3 o ÷ 3: más que eso es sombra o reflejo, no color. Las paredes (y vigas) de un
// nivel son un solo color. Si un objeto sale en varias fotos se
// combinan pesando por superficie. Se descartan el exterior, vidrios, metales, lo que brilla, lo estampado y la foto
// quemada. Guarda las propuestas en capturas/<id>/colores.json; se aplican con: node motor/colores.mjs <id> --aplicar
import { start } from './engine.js';
import { medirVistas, hex, toSRGB, deltaE, lab } from './parecido.js';
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id), id = q.get('depto');
const UMBRAL = Number(q.get('umbral') ?? 8), MIN_PX = 1500;
const scene = await fetch(`/departamentos/${id}/scene.json`).then(r => r.json());
const k0 = Object.keys(scene.views).find(k => scene.views[k].photo);
const api = window.__viewer = await start($('stage'), { scene, state: { view: k0, cut: false, night: false, decor: true }, device: 'desktop' });
const med = await medirVistas(api, scene, { box: $('stage'), guardar: q.get('mapas') ? `${id}/colores` : null });
api.destroy();

const lin = c => { const v = parseInt(c.slice(1), 16); return [v >> 16, (v >> 8) & 255, v & 255].map(x => { x /= 255; return x <= 0.04045 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; }); };
const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
// los marcos de ventana son finos y se mezclan con el vidrio y el exterior: no se miden
const usable = o => o.color && /^#[0-9a-f]{6}$/i.test(o.color) && !['exterior', 'slab', 'sliding-window'].includes(o.kind) && !o.glass && !o.metal && !o.glow && !o.printed && o.px >= 300;
// Lab → lineal (D65)
function fromLab([L, A, B]) {
  const fy = (L + 16) / 116, fx = fy + A / 500, fz = fy - B / 200, g = t => (t ** 3 > 0.008856 ? t ** 3 : (t - 16 / 116) / 7.787);
  const X = g(fx) * 0.95047, Y = g(fy), Z = g(fz) * 1.08883;
  return [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.204 * Y + 1.057 * Z].map(v => Math.min(0.95, Math.max(0.002, v)));
}
// El tono y la saturación se corren hacia lo medido con tope de 10 (en a*b*: más que eso suele ser el balance de
// blancos o un reflejo de la foto, como un piso de madera que salía verde); la claridad, a medias y con tope de 20: la luz de cada rincón de la
// foto (sombra, sol, brillo) no es la del render y se confundiría con el color. Lo blanco y neutro (sanitarios, techos,
// marcos) no se oscurece más de 4: casi siempre es blanco y en la foto sale gris por la sombra.
function propose(src, measured) {
  const S = lab(src), Mm = lab(measured), white = S[0] > 88 && Math.hypot(S[1], S[2]) < 8;
  let L = S[0] + Math.max(-20, Math.min(20, (Mm[0] - S[0]) * 0.5));
  if (white) L = Math.max(L, S[0] - 4);
  const da = Mm[1] - S[1], db = Mm[2] - S[2], d = Math.hypot(da, db), k = d > 10 ? 10 / d : 1;
  return fromLab([L, S[1] + da * k, S[2] + db * k]);
}
const walls = o => o.kind === 'wall' || o.kind === 'structure';
// los muebles iguales (mismo tipo y mismo color: las sillas de un comedor) se miden juntos y reciben el mismo color
const keyOf = o => walls(o) ? JSON.stringify(['wall', o.level ?? 0, o.color.toLowerCase()])
  : o.kind === 'item' ? JSON.stringify(['item', o.type, o.color.toLowerCase()])
  : JSON.stringify([o.kind, o.level ?? 0, o.room ?? null, o.wall ?? null, o.opening ?? null, o.color.toLowerCase()]);
const wmedian = list => { const s = [...list].sort((a, b) => a.r - b.r); let half = s.reduce((t, x) => t + x.w, 0) / 2; for (const x of s) { half -= x.w; if (half <= 0) return x.r; } return 1; };
const acc = new Map();
for (const [vk, v] of Object.entries(med.vistas)) {
  const objs = v.objetos.filter(usable);
  if (!objs.length) continue;
  // exposición y balance de blancos de la foto, por canal: se toman de las paredes y el techo (pintura de color conocido),
  // como quien hace el balance sobre una pared blanca. Si se ven poco, de la mediana de todos los objetos (con eso, la
  // madera y las telas, que son mayoría, corrían el tono de todo lo demás)
  const ratio = (o, c) => o.fotoLin[c] / Math.max(0.003, o.renderLin[c]);
  const ref = objs.filter(o => walls(o) || o.kind === 'ceiling'), refPx = ref.reduce((s, o) => s + o.px, 0), allPx = objs.reduce((s, o) => s + o.px, 0);
  const base = refPx >= 0.15 * allPx ? ref : objs;
  const k = [0, 1, 2].map(c => wmedian(base.map(o => ({ r: ratio(o, c), w: o.px }))));
  for (const o of objs) {
    const src = lin(o.color), t = src.map((s, c) => Math.min(0.95, Math.max(0.002, s * Math.min(3, Math.max(1 / 3, ratio(o, c) / k[c])))));
    const a = acc.get(keyOf(o)) ?? { o: walls(o) ? { ...o, kind: 'wall', wall: null } : o, px: 0, log: [0, 0, 0], vistas: [], cada: [], items: new Map() };
    if (o.kind === 'item') a.items.set(`${o.level}|${o.item}`, { level: o.level, item: o.item, at: o.at });
    a.px += o.px; a.vistas.push(vk); a.cada.push(t); t.forEach((x, c) => { a.log[c] += Math.log(x) * o.px; });
    acc.set(keyOf(o), a);
  }
}
const props = [];
for (const a of acc.values()) {
  const src = lin(a.o.color), t = propose(src, a.log.map(x => Math.exp(x / a.px))), dE = deltaE(src, t);
  if (a.px < MIN_PX || dE < UMBRAL) continue;
  // dispersión: cuánto difieren las propuestas de cada foto entre sí (alta = poco confiable)
  const disp = Math.max(0, ...a.cada.map(x => deltaE(propose(src, x), t)));
  const { kind, level, item, type, at, room, wall, opening, color } = a.o;
  props.push({ kind, level, item, type, at, room, wall, opening, items: [...a.items.values()], de: color, a: hex(t.map(toSRGB)), dE: +dE.toFixed(1), px: a.px, vistas: [...new Set(a.vistas)], dispersion: +disp.toFixed(1),
    // confiable: varias fotos que coinciden, o una sola pero con mucha superficie
    confiable: new Set(a.vistas).size > 1 ? disp <= 12 : a.px >= 40000 });
}
props.sort((x, y) => y.dE * Math.sqrt(y.px) - x.dE * Math.sqrt(x.px));
const out = { fecha: new Date().toISOString(), depto: id, puntaje: med.puntaje, umbral: UMBRAL, propuestas: props };
await fetch(`/capturas/${id}/colores.json`, { method: 'POST', body: JSON.stringify(out, null, 1) });
window.__colores = out;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const what = p => p.kind === 'item' ? `${p.type} (${p.items.map(i => `[${i.at.join(', ')}]`).join(' ')})` : p.kind === 'floor' ? `piso de ${p.room}` : p.kind === 'wall' ? 'paredes' : p.kind === 'ceiling' ? 'techo' : p.kind;
$('estado').innerHTML = `Parecido actual: ΔE medio ${med.puntaje} (más bajo es mejor). ${props.length} propuestas con ΔE ≥ ${UMBRAL}. Guardadas en <code>capturas/${esc(id)}/colores.json</code>; aplicar con <code>node motor/colores.mjs ${esc(id)} --aplicar</code>.`;
$('out').innerHTML = `<table><tr><th>Qué</th><th>Actual</th><th>Medido</th><th>ΔE</th><th>Píxeles</th><th>Dispersión</th><th>Fotos</th></tr>${props.map(p => `<tr><td>${esc(what(p))}</td><td><span class="sw" style="background:${p.de}"></span> ${p.de}</td><td><span class="sw" style="background:${p.a}"></span> ${p.a}</td><td>${p.dE}</td><td>${p.px}</td><td>${p.dispersion}${p.confiable ? '' : ' (poco confiable)'}</td><td>${esc(p.vistas.join(', '))}</td></tr>`).join('')}</table>`;
document.title = 'colores: listo';
</script>
