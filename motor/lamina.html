<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lámina de vistas</title>
<style>
/* Herramienta de desarrollo: una lámina por departamento con varias vistas de día (arriba) y de noche (abajo), para
   antes y después de un cambio de luz o de materiales. */
body{ margin:0; background:#eceef0; font-family:system-ui,"Segoe UI",sans-serif; color:#1d2430; padding:10px }
#stage{ position:fixed; left:-10000px; top:0 } p{ font-size:13px }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<p id="estado">Armando…</p>
<div id="stage"></div>
<script type="module">
// lamina.html?deptos=depto1,depto4&capturar=<carpeta>/<prefijo>[&vistas=living,cocina][&n=3][&lado=420][&noche=0]
// Guarda /capturas/<carpeta>/<prefijo>-<depto>.jpg. Sin "vistas" toma las n primeras con foto (o las primeras de adentro).
// "lighting" en la URL (JSON) se suma al de cada scene, para probar valores sin tocar los archivos.
import { start } from './engine.js';
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const deptos = q.get('deptos')?.split(',') ?? await (await fetch('/api/deptos')).json();
const n = Number(q.get('n') ?? 3), side = Number(q.get('lado') ?? 420), withNight = q.get('noche') !== '0';
const load = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
for (const id of deptos) {
  $('estado').textContent = `Armando ${id}…`;
  const scene = await fetch(`/departamentos/${id}/scene.json`).then(r => r.json());
  if (q.get('lighting')) scene.lighting = { ...scene.lighting, ...JSON.parse(q.get('lighting')) };
  const keys = q.get('vistas')?.split(',').filter(k => scene.views[k])
    ?? Object.keys(scene.views).filter(k => scene.views[k].photo).slice(0, n);
  const A = scene.viewAspect ?? 4 / 3, W = A >= 1 ? side : Math.round(side * A), H = Math.round(W / A);
  Object.assign($('stage').style, { width: `${W}px`, height: `${H}px` });
  const api = await start($('stage'), { scene, state: { view: keys[0], cut: false, night: false, decor: true }, device: 'desktop', base: `/departamentos/${id}/` });
  const rows = withNight ? [false, true] : [false], shots = [];
  for (const night of rows) { api.setNight(night); for (const k of keys) { api.setCut(!!scene.views[k].cut); api.go(k, true); shots.push(await load(api.capture())); } }
  api.destroy();
  // &fotos=1: una fila más con la foto de cada vista (recortada como el render)
  if (q.get('fotos')) { rows.push('foto'); for (const k of keys) shots.push(scene.views[k].photo ? await load(`${scene.photos}${scene.views[k].photo}.png`) : null); }
  const c = Object.assign(document.createElement('canvas'), { width: keys.length * (W + 6), height: rows.length * (H + 6) + 34 }), g = c.getContext('2d');
  g.fillStyle = '#eceef0'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#1d2430'; g.font = '600 18px system-ui'; g.fillText(`${scene.name ?? id} · ${q.get('capturar') ?? ''}`, 6, 23);
  shots.forEach((img, i) => {
    if (!img) return;
    const x = (i % keys.length) * (W + 6), y = 34 + Math.floor(i / keys.length) * (H + 6), s = Math.max(W / img.width, H / img.height);
    g.save(); g.beginPath(); g.rect(x, y, W, H); g.clip(); g.drawImage(img, x + (W - img.width * s) / 2, y + (H - img.height * s) / 2, img.width * s, img.height * s); g.restore();
  });
  if (q.get('capturar')) {
    const url = c.toDataURL('image/jpeg', 0.9), bytes = Uint8Array.from(atob(url.split(',')[1]), ch => ch.charCodeAt(0));
    const [dir, pre] = q.get('capturar').split('/');
    await fetch(`/capturas/${dir}/${pre ? pre + '-' : ''}${id}.jpg`, { method: 'POST', body: bytes });
  }
}
$('estado').textContent = 'Listo'; document.title = 'lámina: lista';
</script>
