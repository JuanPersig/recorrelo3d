<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Texturas desde las fotos</title>
<style>
/* Herramienta de desarrollo (T-23): endereza desde las fotos el piso de cada ambiente y los revestimientos de pared. */
:root{ --bg:#eceef0; --ink:#1d2430; --muted:#5b6573; font-family:system-ui,"Segoe UI",sans-serif }
body{ margin:0; background:var(--bg); color:var(--ink); padding:12px 14px 40px }
h1{ font-size:18px; margin:0 0 4px } p,li{ font-size:13px; color:var(--muted) }
#stage{ position:fixed; left:-10000px; top:0 } img{ height:150px; border-radius:4px; margin:4px; vertical-align:middle }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<h1>Texturas desde las fotos</h1>
<p id="estado">Armando…</p>
<ul id="out"></ul>
<div id="stage"></div>
<script type="module">
// texturas.html?depto=<id>[&lado=1200][&puntaje=16]
// Para el piso de cada ambiente y cada revestimiento de pared ("wall-tiles") busca, en las fotos bien encuadradas
// (puntaje de T-21), el cuadrado más grande y más cerca de la cámara que se vea entero (sin muebles delante, según el
// mapa de identificación). Lo endereza: cada texel es un punto del plano en metros que se proyecta con la cámara de la
// foto. El lado es un múltiplo de la baldosa, así la imagen se repite sin cortar juntas; se le saca la luz de la foto
// (se divide por un desenfoque grande), se deja neutra (el color lo da el parámetro "color", medido en T-22) y los
// bordes se funden con lo que sigue para que no se note la costura. Guarda departamentos/<id>/tex/*.jpg y
// capturas/<id>/texturas.json; se aplica con: node motor/texturas.mjs <id> --aplicar
import { start } from './engine.js';
import { pixels, medir, interior } from './parecido.js';
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id), id = q.get('depto');
const SIDE = Number(q.get('lado') ?? 1600), MAXP = Number(q.get('puntaje') ?? 16), N = 512;
const scene = await fetch(`/departamentos/${id}/scene.json`).then(r => r.json());
// ambientes en L o en U ("rects"): un ambiente por rectángulo, como en el motor
for (const L of [scene, ...(scene.levels ?? [])]) if (L.rooms) L.rooms = L.rooms.flatMap(r => (r.rects ? r.rects.map(rect => ({ ...r, rect, rects: undefined })) : [r]));
const levels = [scene, ...(scene.levels ?? [])];
const keys = Object.keys(scene.views).filter(k => scene.views[k].photo);
const api = window.__viewer = await start($('stage'), { scene, state: { view: keys[0], cut: false, night: false, decor: true }, device: 'desktop', base: `/departamentos/${id}/` });
const load = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
const { THREE } = api._debug;

// superficies: el plano (origen, eje u, eje v en metros), su dominio y qué ids del mapa le corresponden
const surfaces = [];
levels.forEach((L, li) => {
  const y = li ? (L.y ?? (scene.height ?? 2.6) + 0.25) : 0;
  for (const r of L.rooms ?? []) {
    const f = r.floor ?? {}, kind = f.kind ?? 'tile';
    const period = kind === 'planks' ? 0.6 : (f.tile ?? 0.6);   // en tablas, medio largo de tabla: con 1,2 m casi nunca se ve un cuadrado entero
    surfaces.push({ name: `piso-${li}-${r.id ?? r.name}`.replace(/[^\w-]+/g, '_'), label: `piso de ${r.name}`, kind: 'floor', level: li, room: r.name,
      o: new THREE.Vector3(r.rect.x[0], y + 0.0005, r.rect.z[0]), u: new THREE.Vector3(1, 0, 0), v: new THREE.Vector3(0, 0, 1),
      U: r.rect.x[1] - r.rect.x[0], V: r.rect.z[1] - r.rect.z[0], periods: [period, period],
      match: t => t?.kind === 'floor' && t.room === r.name && (t.level ?? 0) === li });
  }
  (L.items ?? []).forEach((it, ii) => {
    if (it.type !== 'wall-tiles') return;
    const p = it.params ?? {}, w = p.width ?? 1, h = p.height ?? 0.6, t = p.thickness ?? 0.014, [tw, th] = p.tile ?? [0.6, 0.3];
    const g = new THREE.Object3D(); g.position.set(it.at[0], y + (it.y ?? 0), it.at[1]); g.rotation.y = THREE.MathUtils.degToRad(it.rotation ?? 0); g.updateMatrixWorld();
    const o = new THREE.Vector3(-w / 2, 0, t + 0.0005).applyMatrix4(g.matrixWorld), ux = new THREE.Vector3(1, 0, 0).transformDirection(g.matrixWorld);
    surfaces.push({ name: `azulejos-${li}-${ii}`, label: `revestimiento en [${it.at.join(', ')}]`, kind: 'item', level: li, item: ii,
      o, u: ux, v: new THREE.Vector3(0, 1, 0), U: w, V: h, periods: [tw, th],
      match: tt => tt?.kind === 'item' && tt.item === ii && (tt.level ?? 0) === li });
  });
});
// lado del cuadrado: el múltiplo común más chico de los dos períodos que pase de 0,45 m (hasta 1,2 m)
// con baldosas, al menos dos por lado: así el control puede ver si las juntas de una coinciden con las de la otra
const sideOf = ([a, b], minK = 1) => { for (let k = minK; k * a <= 1.21; k++) { const S = k * a; if (S >= 0.45 && Math.abs(S / b - Math.round(S / b)) < 0.02) return S; } return Math.max(a, b) * Math.max(1, Math.round(0.6 / Math.max(a, b))); };

// todas las vistas bien encuadradas, con su mapa y su foto
const views = [];
for (const k of keys) {
  const v = scene.views[k], A = v.photoAspect ?? scene.viewAspect ?? 0.75, W = A >= 1 ? SIDE : Math.round(SIDE * A), H = Math.round(W / A);
  Object.assign($('stage').style, { width: `${W}px`, height: `${H}px` }); api.resize(); api.setCut(false); api.go(k, true);
  const map = api.idMap(), photo = pixels(await load(`${scene.photos}${v.photo}.png`), map.width, map.height);
  const score = medir(map, pixels(await load(api.capture('image/png')), map.width, map.height), photo).puntaje;
  if (score <= MAXP) views.push({ k, map, photo, ok: interior(map, 3), vp: new THREE.Matrix4().fromArray(map.viewProj) });
}
api.destroy();
const proj = (V, p, out) => { const c = new THREE.Vector4(p.x, p.y, p.z, 1).applyMatrix4(V.vp); if (c.w <= 0) return null; out[0] = (c.x / c.w * 0.5 + 0.5) * V.map.width; out[1] = (1 - (c.y / c.w * 0.5 + 0.5)) * V.map.height; return out; };
const P = (s, a, b) => s.o.clone().addScaledVector(s.u, a).addScaledVector(s.v, b);
function visible(V, s, a, b) {
  const xy = proj(V, P(s, a, b), [0, 0]); if (!xy) return false;
  const x = Math.round(xy[0]), y = Math.round(xy[1]); if (x < 0 || y < 0 || x >= V.map.width || y >= V.map.height) return false;
  const i = y * V.map.width + x; return V.ok[i] && s.match(V.map.table[V.map.ids[i]]);
}
function sample(V, x, y) {   // bilineal en la foto
  const W = V.map.width, H = V.map.height, d = V.photo.data, x0 = Math.max(0, Math.min(W - 2, Math.floor(x))), y0 = Math.max(0, Math.min(H - 2, Math.floor(y))), fx = x - x0, fy = y - y0, o = [0, 0, 0];
  for (const [dx, dy, w] of [[0, 0, (1 - fx) * (1 - fy)], [1, 0, fx * (1 - fy)], [0, 1, (1 - fx) * fy], [1, 1, fx * fy]]) { const i = ((y0 + dy) * W + x0 + dx) * 4; for (let c = 0; c < 3; c++) o[c] += d[i + c] * w; }
  return o;
}
const out = [], lines = [];
for (const s of surfaces) {
  const tiled = s.kind === 'item' || levels[s.level].rooms?.find(r => r.name === s.room)?.floor?.kind !== 'planks';
  const S = sideOf(s.periods, tiled ? 2 : 1), M = S * 0.12, step = 0.05;
  if (S + M > Math.min(s.U, s.V) + 1e-6) { lines.push(`${s.label}: muy chico para un cuadrado de ${S.toFixed(2)} m`); continue; }
  let best = null, most = 0;
  for (const V of views) for (let a = 0; a + S + M <= s.U + 1e-6; a += step) for (let b = 0; b + S + M <= s.V + 1e-6; b += step) {
    let n = 0;
    for (let i = 0; i <= 6; i++) for (let j = 0; j <= 6; j++) n += visible(V, s, a + (S + M) * i / 6, b + (S + M) * j / 6) ? 1 : 0;
    most = Math.max(most, n);
    if (n < 49) continue;
    // resolución: píxeles de la foto por metro en el centro del cuadrado
    const c0 = proj(V, P(s, a + S / 2, b + S / 2), [0, 0]), c1 = proj(V, P(s, a + S / 2 + 0.1, b + S / 2), [0, 0]), c2 = proj(V, P(s, a + S / 2, b + S / 2 + 0.1), [0, 0]);
    const ppm = Math.min(Math.hypot(c1[0] - c0[0], c1[1] - c0[1]), Math.hypot(c2[0] - c0[0], c2[1] - c0[1])) * 10;
    if (!best || ppm > best.ppm) best = { V, a, b, ppm };
  }
  if (!best || best.ppm * S < 90) { lines.push(`${s.label}: no se ve entero (o se ve muy chico) en ninguna foto bien encuadrada (${most} de 49 puntos${best ? `, ${Math.round(best.ppm * S)} px` : ''})`); continue; }
  // muestreo del cuadrado más un margen, enderezado
  const NM = Math.round(N * (S + M) / S), img = new Float32Array(NM * NM * 3), xy = [0, 0];
  for (let j = 0; j < NM; j++) for (let i = 0; i < NM; i++) {
    proj(best.V, P(s, best.a + (i + 0.5) * S / N, best.b + (j + 0.5) * S / N), xy);
    const c = sample(best.V, xy[0], xy[1]); for (let k = 0; k < 3; k++) img[(j * NM + i) * 3 + k] = (c[k] / 255) ** 2.2;
  }
  // luz de la foto: se divide por un desenfoque grande (caja repetida) y se deja neutra con media 0,8
  const blur = Float32Array.from(img), R = Math.round(NM / 6);
  for (let pass = 0; pass < 3; pass++) for (const horiz of [true, false]) {
    const src = Float32Array.from(blur);
    for (let j = 0; j < NM; j++) for (let i = 0; i < NM; i++) for (let k = 0; k < 3; k++) {
      let sum = 0, n = 0;
      for (let d = -R; d <= R; d += 2) { const ii = horiz ? Math.min(NM - 1, Math.max(0, i + d)) : i, jj = horiz ? j : Math.min(NM - 1, Math.max(0, j + d)); sum += src[(jj * NM + ii) * 3 + k]; n++; }
      blur[(j * NM + i) * 3 + k] = sum / n;
    }
  }
  const flat = img.map((v, i) => v / Math.max(1e-4, blur[i])), mean = [0, 1, 2].map(k => { let t = 0; for (let i = k; i < flat.length; i += 3) t += flat[i]; return t / (flat.length / 3); });
  // costura: los primeros M metros se funden con lo que sigue después del lado (que es el mismo dibujo, un período más allá)
  const m = NM - N, tex = new Uint8ClampedArray(N * N * 4);
  const at = (i, j, k) => flat[(j * NM + i) * 3 + k] / mean[k] * 0.8;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const wx = i < m ? i / m : 1, wy = j < m ? j / m : 1;
    for (let k = 0; k < 3; k++) {
      const a = at(i, j, k), bx = i < m ? at(i + N, j, k) : a, by = j < m ? at(i, j + N, k) : a, bxy = i < m && j < m ? at(i + N, j + N, k) : bx;
      const v = (a * wx + bx * (1 - wx)) * wy + (by * wx + bxy * (1 - wx)) * (1 - wy);
      tex[(j * N + i) * 4 + k] = 255 * Math.min(1, Math.max(0, v)) ** (1 / 2.2);
    }
    tex[(j * N + i) * 4 + 3] = 255;
  }
  // Control de calidad: (1) en baldosas, la imagen corrida una baldosa tiene que parecerse a sí misma (las juntas
  // coinciden: el encuadre de la foto calza y no está girada); (2) sin brillos ni manchas fuertes (desvío de la
  // luminancia); (3) sin colores ajenos al material (un mueble o una alfombra que el modelo no tiene ahí)
  const lumA = new Float32Array(N * N); for (let i = 0; i < N * N; i++) lumA[i] = (tex[i * 4] * 0.3 + tex[i * 4 + 1] * 0.59 + tex[i * 4 + 2] * 0.11) / 255;
  const avg = lumA.reduce((s, x) => s + x, 0) / lumA.length, sd = Math.sqrt(lumA.reduce((s, x) => s + (x - avg) ** 2, 0) / lumA.length);
  let chroma = 0; for (let i = 0; i < N * N; i++) { const r = tex[i * 4], g = tex[i * 4 + 1], b = tex[i * 4 + 2]; chroma += (Math.max(r, g, b) - Math.min(r, g, b)) / 255; } chroma /= N * N;
  let period = null;
  if (s.periods[0] < S - 1e-6 || s.kind === 'floor' && levels[s.level].rooms?.find(r => r.name === s.room)?.floor?.kind !== 'planks') {
    const sh = Math.round(N * s.periods[0] / S), shy = Math.round(N * s.periods[1] / S);
    if (sh < N || shy < N) {
      let num = 0, da = 0, db = 0;
      for (let j = 0; j < N; j += 2) for (let i = 0; i < N; i += 2) { const a = lumA[j * N + i] - avg, b = lumA[((j + shy) % N) * N + (i + sh) % N] - avg; num += a * b; da += a * a; db += b * b; }
      period = +(num / Math.sqrt(da * db + 1e-9)).toFixed(2);
    }
  }
  const fallas = [period != null && period < 0.5 ? `las juntas no coinciden (${period})` : '', sd > 0.12 ? `brillos o manchas (${sd.toFixed(2)})` : '', chroma > 0.18 ? `colores ajenos (${chroma.toFixed(2)})` : ''].filter(Boolean);
  const c = Object.assign(document.createElement('canvas'), { width: N, height: N }); c.getContext('2d').putImageData(new ImageData(tex, N, N), 0, 0);
  const file = `tex/${s.name}.jpg`, url = c.toDataURL('image/jpeg', 0.85);
  await fetch(`/departamentos/${id}/${file}`, { method: 'POST', body: Uint8Array.from(atob(url.split(',')[1]), ch => ch.charCodeAt(0)) });
  const { kind, level, room, item } = s;
  out.push({ kind, level, room, item, texture: file, textureSize: +S.toFixed(3), vista: best.V.k, pxPorMetro: Math.round(best.ppm), aceptada: !fallas.length, fallas });
  lines.push(`<img src="/departamentos/${id}/${file}?${Date.now()}" alt=""> ${s.label}: ${S.toFixed(2)} m desde "${scene.views[best.V.k].name}", ${Math.round(best.ppm)} px/m, ${Math.round(url.length * 0.75 / 1024)} KB · ${fallas.length ? 'NO se aplica: ' + fallas.join(', ') : 'pasa el control'}`);
}
await fetch(`/capturas/${id}/texturas.json`, { method: 'POST', body: JSON.stringify({ fecha: new Date().toISOString(), texturas: out }, null, 1) });
$('estado').textContent = `${out.length} texturas de ${surfaces.length} superficies (vistas bien encuadradas: ${views.map(v => v.k).join(', ')}).`;
$('out').innerHTML = lines.map(l => `<li>${l}</li>`).join('');
window.__texturas = { n: out.length, lines }; document.title = 'texturas: listo';
</script>
