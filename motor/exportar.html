<!doctype html>
<meta charset="utf-8">
<title>Exportar entrega</title>
<style>
/* Herramienta de producción: links, QR y portada de la entrega. El lienzo se dibuja fuera de la vista, al tamaño final. */
body{ margin:0; font:14px system-ui,"Segoe UI",sans-serif; color:#1d2430; background:#eceef0 }
#log{ padding:12px 14px; white-space:pre-wrap }
#stage{ position:fixed; left:0; top:0; transform:translateX(-200vw) }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<div id="log">Preparando…</div>
<div id="stage"></div>
<script type="module">
// exportar.html?scene=/departamentos/<id>/scene.json&id=<id>[&portada=<vista>][&url=<link publicado>][&imagenes=1][&lado=1600]
// Guarda en entregas/<id>/ (con el servidor `visor`): portada.jpg (la vista "portada", de día; por defecto la primera
// con foto) para la tarjeta del QR, links.json con el link directo a cada vista (?vista=<clave>) y, si se pasa "url",
// qr.png con el link publicado. La entrega es el recorrido 3D y la tarjeta: las imágenes de día y de noche por vista
// (en la proporción de su foto, lado largo de "lado" píxeles) salen solo con &imagenes=1, para trabajo interno.
import { start } from './engine.js';
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const id = q.get('id'), side = Number(q.get('lado')) || 1600, url = q.get('url'), all = q.get('imagenes') === '1';
const log = t => { $('log').textContent += `\n${t}`; };
const scene = await (await fetch(q.get('scene'))).json();
const save = (name, dataUrl) => {   // de data URL a bytes sin toBlob (con el panel oculto puede no responder)
  const b = atob(dataUrl.split(',')[1]), a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return fetch(`/entregas/${id}/${name}`, { method: 'POST', body: a }).then(r => { if (!r.ok) throw new Error(`${name}: ${r.status}`); });
};

const keys = Object.keys(scene.views);
const api = await start($('stage'), { scene, state: { view: keys[0], cut: !!scene.views[keys[0]].cut, night: false, decor: true, pose: null }, device: q.get('device') ?? 'desktop', base: new URL('.', new URL(q.get('scene'), location.href)).pathname });
await api.ready;   // reflejos de cada ambiente
const pr = api._debug.renderer.getPixelRatio();
$('log').textContent = `${scene.name} · ${keys.length} vistas`;
const files = [];
const cover = scene.views[q.get('portada')] ? q.get('portada') : keys.find(k => scene.views[k].photo) ?? keys[0];
for (const [i, k] of keys.entries()) {
  if (!all && k !== cover) continue;
  const v = scene.views[k], a = v.photo ? (v.photoAspect ?? scene.viewAspect ?? 0.75) : 4 / 3;
  const W = a >= 1 ? side : Math.round(side * a), H = a >= 1 ? Math.round(side / a) : side;
  Object.assign($('stage').style, { width: `${W / pr}px`, height: `${H / pr}px` }); api.resize();
  api.setCut(!!v.cut); api.go(k, true);
  for (const [night, tag] of all ? [[false, 'dia'], [true, 'noche']] : [[false, 'dia']]) {
    api.setNight(night);
    const name = all ? `${String(i + 1).padStart(2, '0')}-${k}-${tag}.jpg` : 'portada.jpg';
    await save(name, api.capture('image/jpeg')); files.push(name); log(`✓ ${name} (${W}×${H})`);
    if (all && k === cover && !night) { await save('portada.jpg', api.capture('image/jpeg')); log('✓ portada.jpg'); }
  }
}
api.setNight(false);
const base = url ?? '';
const links = Object.fromEntries(keys.map(k => [scene.views[k].name, `${base}?vista=${encodeURIComponent(k)}`]));
await save('links.json', `data:application/json;base64,${btoa(unescape(encodeURIComponent(JSON.stringify({ departamento: scene.name, link: url, vistas: links }, null, 2))))}`);
log('✓ links.json');
if (url) {
  await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload = ok; s.onerror = ko; document.head.append(s); });
  const box = document.createElement('div'); document.body.append(box);
  new QRCode(box, { text: url, width: 1024, height: 1024, correctLevel: QRCode.CorrectLevel.M });
  await save('qr.png', box.querySelector('canvas').toDataURL('image/png')); log('✓ qr.png');
}
document.title = 'entrega lista';
log(`Listo: entregas/${id}/ (${files.length === 1 ? 'portada' : files.length + ' imágenes'})`);
</script>
