<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estampados desde las fotos</title>
<style>
/* Herramienta de desarrollo (T-24): recorta de las fotos el estampado de cada tela (almohadones, acolchados, mantas,
   cortinas, alfombras, tapizados). */
:root{ --bg:#eceef0; --ink:#1d2430; --muted:#5b6573; font-family:system-ui,"Segoe UI",sans-serif }
body{ margin:0; background:var(--bg); color:var(--ink); padding:12px 14px 40px }
h1{ font-size:18px; margin:0 0 4px } p,li{ font-size:13px; color:var(--muted) }
#stage{ position:fixed; left:-10000px; top:0 } img{ height:110px; border-radius:4px; margin:4px; vertical-align:middle }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<h1>Estampados desde las fotos</h1>
<p id="estado">Armando…</p>
<ul id="out"></ul>
<div id="stage"></div>
<script type="module">
// telas.html?depto=<id>[&puntaje=16][&lado=1200]
// Para cada tela del modelo (material de tela de un mueble) busca en las fotos bien encuadradas el cuadrado más grande
// que sea solo esa tela (mapa de identificación de T-21, 4 px adentro del borde). Si ahí la foto tiene dibujo (rayas,
// cuadros, flores: contraste después de sacar la luz) lo recorta, lo deja neutro (el color medio lo da el parámetro,
// medido en T-22) y repetible. Muebles iguales (mismo tipo y color) comparten estampado. Guarda
// departamentos/<id>/tex/tela-*.jpg y capturas/<id>/telas.json; se aplica con: node motor/telas.mjs <id> --aplicar
import { start } from './engine.js';
import { pixels, medir, interior } from './parecido.js';
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id), id = q.get('depto');
const SIDE = Number(q.get('lado') ?? 1200), MAXP = Number(q.get('puntaje') ?? 16), N = 256, MIN = 72;
const scene = await fetch(`/departamentos/${id}/scene.json`).then(r => r.json());
const keys = Object.keys(scene.views).filter(k => scene.views[k].photo);
const api = await start($('stage'), { scene, state: { view: keys[0], cut: false, night: false, decor: true }, device: 'desktop', base: `/departamentos/${id}/` });
const load = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
const best = new Map();   // "tipo|color" → mejor cuadrado
for (const k of keys) {
  const v = scene.views[k], A = v.photoAspect ?? scene.viewAspect ?? 0.75, W = A >= 1 ? SIDE : Math.round(SIDE * A), H = Math.round(W / A);
  Object.assign($('stage').style, { width: `${W}px`, height: `${H}px` }); api.resize(); api.setCut(false); api.go(k, true);
  const map = api.idMap(), photo = pixels(await load(`${scene.photos}${v.photo}.png`), map.width, map.height);
  if (medir(map, pixels(await load(api.capture('image/png')), map.width, map.height), photo).puntaje > MAXP) continue;
  const ok = interior(map, 4), w = map.width, h = map.height;
  // el cuadrado más grande de píxeles interiores de cada id (programación dinámica)
  const dp = new Uint16Array(w * h), top = new Map();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, t = map.table[map.ids[i]];
    if (!ok[i] || t?.kind !== 'item' || t.material !== 'MeshPhysicalMaterial' || t.glass || t.printed || !t.color) continue;   // lo ya estampado (rayas, hojas) queda como está
    const same = j => map.ids[j] === map.ids[i] ? dp[j] : 0;
    dp[i] = x && y ? 1 + Math.min(same(i - 1), same(i - w), same(i - w - 1)) : 1;
    const key = `${t.type}|${t.color.toLowerCase()}`;
    if (dp[i] > (top.get(key)?.s ?? 0)) top.set(key, { s: dp[i], x: x - dp[i] + 1, y: y - dp[i] + 1, t });
  }
  for (const [key, c] of top) if (c.s >= MIN && c.s > (best.get(key)?.s ?? 0)) best.set(key, { ...c, k, photo, w });
}
api.destroy();
const out = [], lines = [];
for (const [key, c] of best) {
  // recorte a N × N (lineal), luz sacada con un desenfoque grande, neutro con media 0,8
  const img = new Float32Array(N * N * 3);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    // solo el 70 % del centro del cuadrado: en los bordes la foto trae a veces el fondo (la tela de la foto no calza
    // exacto con la del modelo) y quedaban manchas blancas en las esquinas del almohadón
    const sx = c.x + c.s * (0.15 + 0.7 * (i + 0.5) / N), sy = c.y + c.s * (0.15 + 0.7 * (j + 0.5) / N), p = (Math.floor(sy) * c.w + Math.floor(sx)) * 4;
    for (let k = 0; k < 3; k++) img[(j * N + i) * 3 + k] = (c.photo.data[p + k] / 255) ** 2.2;
  }
  const blur = Float32Array.from(img), R = Math.round(N / 6);
  for (let pass = 0; pass < 3; pass++) for (const hz of [true, false]) {
    const src = Float32Array.from(blur);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) for (let k = 0; k < 3; k++) {
      let s = 0, n = 0; for (let d = -R; d <= R; d += 2) { const ii = hz ? Math.min(N - 1, Math.max(0, i + d)) : i, jj = hz ? j : Math.min(N - 1, Math.max(0, j + d)); s += src[(jj * N + ii) * 3 + k]; n++; }
      blur[(j * N + i) * 3 + k] = s / n;
    }
  }
  const flat = img.map((v, i) => v / Math.max(1e-4, blur[i])), mean = [0, 1, 2].map(k => { let t = 0; for (let i = k; i < flat.length; i += 3) t += flat[i]; return t / (N * N); });
  // el estampado conserva sus colores: se divide solo por la luminancia de la luz y se lleva a la claridad del color medido
  const lin1 = h => { const v = parseInt(h.slice(1), 16); return [v >> 16, (v >> 8) & 255, v & 255].map(x => (x / 255) ** 2.2); };
  const keepCol = new Float32Array(N * N * 3);
  for (let i = 0; i < N * N; i++) { const bl = 0.2126 * blur[i * 3] + 0.7152 * blur[i * 3 + 1] + 0.0722 * blur[i * 3 + 2]; for (let k = 0; k < 3; k++) keepCol[i * 3 + k] = img[i * 3 + k] / Math.max(1e-4, bl); }
  const kl = keepCol.reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i % 3], 0) / (N * N);
  // dibujo: contraste de la imagen ya sin luz y apenas suavizada (el grano de la tela y el ruido de la foto no cuentan)
  const lum = new Float32Array(N * N); for (let i = 0; i < N * N; i++) lum[i] = (flat[i * 3] / mean[0] * 0.3 + flat[i * 3 + 1] / mean[1] * 0.59 + flat[i * 3 + 2] / mean[2] * 0.11);
  const sm = new Float32Array(N * N); for (let j = 2; j < N - 2; j++) for (let i = 2; i < N - 2; i++) { let s = 0; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) s += lum[(j + dy) * N + i + dx]; sm[j * N + i] = s / 25; }
  const inner = [...sm].filter((_, i) => { const x = i % N, y = (i / N) | 0; return x > 2 && y > 2 && x < N - 3 && y < N - 3; });
  const av = inner.reduce((s, v) => s + v, 0) / inner.length, sd = Math.sqrt(inner.reduce((s, v) => s + (v - av) ** 2, 0) / inner.length);
  const [type, color] = key.split('|');
  if (sd < 0.09) { lines.push(`${type} ${color}: lisa en la foto (${sd.toFixed(2)}), sin estampado`); continue; }
  // un estampado se repite: la imagen corrida algunos píxeles en alguna dirección se parece a sí misma. Los pliegues, los
  // bordes de otro mueble o un encuadre corrido no se repiten (autocorrelación en 64 × 64, corrimientos de 6 a 24)
  const D = 64, small = new Float32Array(D * D);
  for (let j = 0; j < D; j++) for (let i = 0; i < D; i++) small[j * D + i] = sm[Math.min(N - 3, Math.max(2, Math.round((j + 0.5) * N / D))) * N + Math.min(N - 3, Math.max(2, Math.round((i + 0.5) * N / D)))];
  // antes, se le saca lo suave (media local de 9 × 9): si no, los degradés y pliegues se parecen a sí mismos corridos
  const loc = new Float32Array(D * D);
  for (let j = 0; j < D; j++) for (let i = 0; i < D; i++) { let s = 0, n = 0; for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const y = j + dy, x = i + dx; if (x >= 0 && y >= 0 && x < D && y < D) { s += small[y * D + x]; n++; } } loc[j * D + i] = s / n; }
  for (let i = 0; i < D * D; i++) small[i] -= loc[i];
  const sMean = 0;
  let rep = 0;
  for (let dy = -24; dy <= 24; dy += 2) for (let dx = -24; dx <= 24; dx += 2) {
    if (Math.hypot(dx, dy) < 5) continue;
    let num = 0, da = 0, db = 0;
    for (let j = Math.max(0, -dy); j < D - Math.max(0, dy); j++) for (let i = Math.max(0, -dx); i < D - Math.max(0, dx); i++) { const a = small[j * D + i] - sMean, b = small[(j + dy) * D + i + dx] - sMean; num += a * b; da += a * a; db += b * b; }
    rep = Math.max(rep, num / Math.sqrt(da * db + 1e-9));
  }
  if (rep < 0.3) { lines.push(`${type} ${color}: el dibujo no se repite (${rep.toFixed(2)}): pliegues u otro objeto, no se usa`); continue; }
  // repetible: los primeros M píxeles se funden con el lado opuesto en espejo
  const M = N / 8, tex = new Uint8ClampedArray(N * N * 4);
  const target = (([r, g, b]) => 0.2126 * r + 0.7152 * g + 0.0722 * b)(lin1(key.split('|')[1]));
  const at = (i, j, k) => keepCol[(j * N + i) * 3 + k] / kl * target;
  const wOf = i => Math.min(1, Math.min(i, N - 1 - i) / M);
  const vx = (i, j, k) => at(i, j, k) * wOf(i) + at(N - 1 - i, j, k) * (1 - wOf(i));
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    for (let k = 0; k < 3; k++) {
      const v = vx(i, j, k) * wOf(j) + vx(i, N - 1 - j, k) * (1 - wOf(j));
      tex[(j * N + i) * 4 + k] = 255 * Math.min(1, Math.max(0, v)) ** (1 / 2.2);
    }
    tex[(j * N + i) * 4 + 3] = 255;
  }
  const cv = Object.assign(document.createElement('canvas'), { width: N, height: N }); cv.getContext('2d').putImageData(new ImageData(tex, N, N), 0, 0);
  const file = `tex/tela-${type}-${color.slice(1)}.jpg`, url = cv.toDataURL('image/jpeg', 0.86);
  await fetch(`/departamentos/${id}/${file}`, { method: 'POST', body: Uint8Array.from(atob(url.split(',')[1]), ch => ch.charCodeAt(0)) });
  out.push({ type, color, texture: file, vista: c.k, px: c.s, dibujo: +sd.toFixed(2), repeticion: +rep.toFixed(2), aceptada: false });   // se revisa a ojo y se aplica con --solo: el control automático no distingue bien un estampado de un pliegue
  lines.push(`<img src="/departamentos/${id}/${file}?${Date.now()}" alt=""> ${type} ${color}: ${c.s} px desde "${scene.views[c.k].name}", dibujo ${sd.toFixed(2)}, se repite ${rep.toFixed(2)}${c.s >= 96 ? '' : ' · muy chico, no se aplica'}`);
}
await fetch(`/capturas/${id}/telas.json`, { method: 'POST', body: JSON.stringify({ fecha: new Date().toISOString(), telas: out }, null, 1) });
$('estado').textContent = `${out.length} estampados de ${best.size} telas que se ven en fotos bien encuadradas.`;
$('out').innerHTML = lines.map(l => `<li>${l}</li>`).join('');
window.__telas = { n: out.length, lines }; document.title = 'telas: listo';
</script>
