<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio de materiales</title>
<style>
/* Herramienta de desarrollo (2026-11-08): un ambiente genérico con las familias de materiales del motor (piso, pared,
   madera, telas, piedra), a tres distancias, de día y de noche. Sirve para aprobar un material sin depender de un depto. */
body{ margin:0; background:#eceef0; font-family:system-ui,"Segoe UI",sans-serif; color:#1d2430; padding:10px }
#stage{ width:480px; height:640px } p{ font-size:13px }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<p id="estado">Armando…</p>
<div id="stage"></div>
<script type="module">
// pruebas/materiales.html?piso=herringbone|planks|tile|terrazzo[&color=#b98a5a][&motor=/dist/motor-head/][&capturar=materiales/<nombre>]
// Una hoja con 3 distancias (lejos, media, cerca) × día y noche.
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const { start } = await import((q.get('motor') ?? '/motor/') + 'engine.js');
const piso = q.get('piso') ?? 'herringbone', color = q.get('color') ?? (piso === 'tile' ? '#cfcac2' : '#b98a5a');
const scene = {
  name: 'Laboratorio', height: 2.6, wallColor: '#efebe4',
  rooms: [{ name: 'Living', rect: { x: [-3, 3], z: [-2.5, 2.5] }, floor: { kind: piso, color } }],
  walls: [{ from: [-3, -2.5], to: [3, -2.5], openings: [{ kind: 'sliding-window', at: 3.5, width: 1.4, sill: 0.9, height: 1.3, panels: 2 }] },
    { from: [-3, 2.5], to: [3, 2.5] }, { from: [-3, -2.5], to: [-3, 2.5] }, { from: [3, -2.5], to: [3, 2.5] }],
  items: [
    { type: 'sofa', at: [-1.2, -1.95], params: { color: '#c9c2b6' } },
    { type: 'coffee-table', at: [-1.2, -0.9] },
    { type: 'sideboard', at: [1.6, -2.21] },
    { type: 'dining-table', at: [1.3, 0.9], params: { shape: 'oval', color: '#9a7350' } },
    { type: 'chair', at: [1.3, 1.65], rotation: 180, params: { style: 'wood' } },
    { type: 'console-table', at: [-2.77, 1.2], rotation: 90 },
    { type: 'ceiling-light', at: [-1, -0.8] }, { type: 'ceiling-light', at: [1.3, 0.9] },
  ],
  exterior: {},
  lighting: { sunFrom: [6, 6, -10] },
  views: {
    lejos: { name: 'Lejos', pos: [2.6, 1.6, 2.3], target: [-0.6, 0.5, -1.2], fov: 70 },
    media: { name: 'Media', pos: [0.4, 1.3, 0.4], target: [-1.2, 0.4, -1.9], fov: 60 },
    cerca: { name: 'Cerca', pos: [0.75, 1.05, 0.15], target: [1.3, 0.55, 0.9], fov: 45 },
  },
};
const names = Object.keys(scene.views);
const api = window.__viewer = await start($('stage'), { scene, state: { view: names[0], cut: false, night: false, decor: true }, device: 'desktop' });
await api.ready;
const load = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.src = src; });
const shots = [];
for (const night of [false, true]) for (const k of names) { api.setNight(night); api.go(k, true); shots.push([`${scene.views[k].name} · ${night ? 'noche' : 'día'}`, await load(api.capture())]); }
const W = 360, H = 480, c = Object.assign(document.createElement('canvas'), { width: 3 * (W + 6), height: 2 * (H + 26) }), g = c.getContext('2d');
g.fillStyle = '#eceef0'; g.fillRect(0, 0, c.width, c.height);
shots.forEach(([t, im], i) => { const x = (i % 3) * (W + 6), y = Math.floor(i / 3) * (H + 26); g.drawImage(im, x, y + 22, W, H); g.fillStyle = '#1d2430'; g.font = '600 15px system-ui'; g.fillText(t, x + 4, y + 16); });
$('estado').textContent = `${api.warnings.length} avisos${api.warnings.length ? ': ' + api.warnings.join(' | ') : ''}`;
if (q.get('capturar')) { const url = c.toDataURL('image/jpeg', 0.9); await fetch(`/capturas/${q.get('capturar')}.jpg`, { method: 'POST', body: Uint8Array.from(atob(url.split(',')[1]), ch => ch.charCodeAt(0)) }); }
document.title = 'materiales: listo';
</script>
