    resumen.push({ variante: variant, parametro: name, vistas: ps.length, picoEnLaVerdad: ps.filter(p => p.pico === 0).length, medianaDelPico: +med0(ps.map(p => Math.abs(p.pico))).toFixed(3),
      puntajeA2Pasos: +med0(ps.map(p => (p.s[2] + p.s[4]) / 2)).toFixed(3) /* −1 y +1 paso */, puntajeA2: +med0(ps.map(p => (p.s[1] + p.s[5]) / 2)).toFixed(3) /* ±2 pasos */, puntajeA4: +med0(ps.map(p => (p.s[0] + p.s[6]) / 2)).toFixed(3) });
  }
  const outB = { fecha: new Date().toISOString(), depto: id, lado: SIDE, segundos: Math.round((performance.now() - t0) / 1000), unidad: { lateral: '5 cm', adelante: '5 cm', altura: '5 cm', giro: '1°', cabeceo: '1°', fov: '2°' }, resumen, vistas: sweep };
  await fetch(`/capturas/calibrar/${id}-barrido-${NAME}.json`, { method: 'POST', body: JSON.stringify(outB, null, 1) });
  $('estado').textContent = `Barrido de ${sweep.length / VARS.length} vistas en ${outB.segundos} s.`;
  window.__calibrar = outB; document.title = 'calibrar: listo';
} else {
const med = a => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : NaN; };
const groups = {}; for (const r of rows) (groups[`${r.variante} · ${r.pert}`] ??= []).push(r);
const summary = Object.entries(groups).map(([g, rs]) => ({ grupo: g, n: rs.length, posCm: +(med(rs.map(r => r.despues.pos)) * 100).toFixed(1), angGrados: +med(rs.map(r => r.despues.ang)).toFixed(2), fovGrados: +med(rs.map(r => Math.abs(r.despues.fov))).toFixed(2),
  posInicialCm: +(med(rs.map(r => r.antes.pos)) * 100).toFixed(1), recuperadas: rs.filter(r => r.ok).length, verdadMejorQueInicio: rs.filter(r => r.sVerdad > r.sInicio).length, verdadMejorQueFinal: rs.filter(r => r.sVerdad >= r.sFinal).length }));
const out = { fecha: new Date().toISOString(), depto: id, lado: SIDE, fovFijo: FOVFIX, segundos: Math.round((performance.now() - t0) / 1000), resumen: summary, vistas: rows };
await fetch(`/capturas/calibrar/${id}-${NAME}.json`, { method: 'POST', body: JSON.stringify(out, null, 1) });
$('estado').textContent = `${rows.length} corridas en ${out.segundos} s. Guardado en capturas/calibrar/${id}-${NAME}.json`;
$('resumen').innerHTML = `<table><tr><th>variante · perturbación</th><th>n</th><th>error inicial (cm)</th><th>error final (cm)</th><th>ángulo (°)</th><th>fov (°)</th><th>recuperadas</th><th>verdad ≥ inicio</th><th>verdad ≥ final</th></tr>${summary.map(s => `<tr><td>${s.grupo}</td><td>${s.n}</td><td>${s.posInicialCm}</td><td>${s.posCm}</td><td>${s.angGrados}</td><td>${s.fovGrados}</td><td>${s.recuperadas}/${s.n}</td><td>${s.verdadMejorQueInicio}/${s.n}</td><td>${s.verdadMejorQueFinal}/${s.n}</td></tr>`).join('')}</table>`;
window.__calibrar = out; document.title = 'calibrar: listo';
}
</script>
