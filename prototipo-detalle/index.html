<title>Prueba de detalle 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;650&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Visor a pantalla completa; paneles flotantes arriba y barras abajo. La barra del prototipo es negra para que no parezca parte del diseño. */
:root{
  --bg:#e4e8eb; --sky:#dfe7ee; --panel:rgba(250,251,252,.88); --ink:#1d2430; --muted:#5b6573;
  --line:rgba(29,36,48,.12); --accent:#2d3a52; --accent-ink:#f4f6fa; --chip:rgba(29,36,48,.06);
  --proto:#111; --proto-ink:#fff; --proto-hi:#ffd23f;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a21; --sky:#1b222b; --panel:rgba(24,30,38,.88); --ink:#e9edf2; --muted:#9aa5b3;
    --line:rgba(233,237,242,.14); --accent:#c9d5ea; --accent-ink:#141a24; --chip:rgba(233,237,242,.08);
    --proto:#000; --proto-ink:#fff; --proto-hi:#ffd23f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a21; --sky:#1b222b; --panel:rgba(24,30,38,.88); --ink:#e9edf2; --muted:#9aa5b3;
  --line:rgba(233,237,242,.14); --accent:#c9d5ea; --accent-ink:#141a24; --chip:rgba(233,237,242,.08);
  --proto:#000; --proto-ink:#fff; --proto-hi:#ffd23f; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}
.head{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));
  width:min(360px,calc(100% - 28px));border-radius:16px;padding:13px 15px 12px;display:grid;gap:6px}
.head h1{margin:0;font-size:17px;line-height:1.25;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.head p{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.stats{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.head .row{display:flex;gap:8px;flex-wrap:wrap}
.link{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--chip);border:0;border-radius:10px;padding:5px 10px;cursor:pointer}
.link:hover{background:var(--line)}
.bars{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;
  pointer-events:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar{pointer-events:auto;display:flex;gap:6px;align-items:center;max-width:100%;overflow-x:auto;border-radius:20px;padding:6px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.sep{flex:0 0 1px;align-self:stretch;background:var(--line);margin:4px}
.bar button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:transparent;border:0;border-radius:14px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:var(--chip)}
.bar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar .toggle[aria-pressed="true"]{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.bar button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.proto{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--proto);color:var(--proto-ink);border-radius:999px;padding:4px;
  box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:100%}
.proto button{font:inherit;color:inherit;background:transparent;border:0;border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer;flex:0 0 auto}
.proto button:hover{background:rgba(255,255,255,.14)}
.proto button:focus-visible{outline:2px solid var(--proto-hi)}
.proto .lbl{font-size:14px;font-weight:650;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.proto .lbl b{color:var(--proto-hi);font-weight:650}
.proto .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding-left:12px}
.drawer{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
  width:min(420px,calc(100% - 28px));max-height:calc(100% - 200px);border-radius:16px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 8px 15px;font-weight:650;font-size:14px}
.drawer pre{margin:0;padding:0 15px 14px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--ink);min-width:0}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:560px){
  .head{padding:10px 12px}
  .head h1{font-size:15.5px}
  .head .desc{display:none}
  .bar button{font-size:13.5px;padding:8px 10px}
  .proto .tag{display:none}
}
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>

<div id="app">
  <div id="stage"></div>
  <div class="head glass">
    <h1 id="vTitle">Dormitorio</h1>
    <p class="desc" id="vDesc"></p>
    <div class="stats" id="stats" aria-live="off">…</div>
    <div class="row"><button class="link" id="tJson" aria-expanded="false">Ver scene.json</button></div>
  </div>
  <div class="drawer glass" id="drawer" hidden>
    <header><span>scene.json (lo único que Claude escribe por departamento)</span><button class="link" id="closeJson">Cerrar</button></header>
    <pre id="json"></pre>
  </div>
  <div class="bars">
    <div class="bar glass" role="toolbar" aria-label="Vistas del modelo" id="views"></div>
    <div class="proto" role="group" aria-label="Variante del prototipo">
      <span class="tag">Prototipo</span>
      <button id="prev" aria-label="Variante anterior">‹</button>
      <span class="lbl" id="vLabel"></span>
      <button id="next" aria-label="Variante siguiente">›</button>
    </div>
  </div>
  <div class="err" id="err" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="legacy.js"></script>
<script type="module">
// PROTOTIPO desechable: tres variantes del mismo dormitorio, con la misma cámara, para comparar el nivel de detalle.
import { start as startEngine } from './engine.js';

const VARIANTS = {
  A: { name: 'Actual', title: 'Dormitorio · como está hoy',
       desc: 'Cajas y esferas con coordenadas escritas a mano en el HTML. Three.js r128, sin oclusión ambiental ni luz de entorno.',
       run: (el, o) => window.LegacyViewer.start(el, o) },
  B: { name: 'Motor nuevo', title: 'Dormitorio · motor nuevo',
       desc: 'El mismo dormitorio leído desde scene.json. Muebles paramétricos con bordes redondeados, tela que cae, texturas, luz de ventana y oclusión ambiental.',
       run: (el, o) => startEngine(el, { ...o, preset: 'premium' }) },
  C: { name: 'Motor nuevo, estilo maqueta', title: 'Dormitorio · estilo maqueta',
       desc: 'Mismo scene.json y mismos componentes con materiales mate. El estilo es un ajuste del motor, no otro modelo.',
       run: (el, o) => startEngine(el, { ...o, preset: 'clay' }) },
};
const KEYS = Object.keys(VARIANTS);
const $ = id => document.getElementById(id);
const stage = $('stage');

let scene;
try { scene = await (await fetch('./scene.json')).json(); }
catch (e) { $('err').textContent = 'No se pudo leer scene.json. Abrí el prototipo con el servidor local (node serve.mjs).'; $('err').hidden = false; throw e; }
$('json').textContent = JSON.stringify(scene, null, 2);

const state = { view: 'puerta', cut: false, night: false, decor: true, pose: null };
let api = null, cur = null;

// barra de vistas
const viewsEl = $('views');
const viewBtns = Object.entries(scene.views).map(([key, v]) => {
  const b = document.createElement('button'); b.textContent = v.name; b.dataset.view = key;
  b.addEventListener('click', () => { state.view = key; state.cut = v.cut; api.setCut(v.cut); api.go(key); sync(); });
  viewsEl.appendChild(b); return b;
});
viewsEl.appendChild(Object.assign(document.createElement('span'), { className: 'sep' }));
const toggle = (label, onClick) => { const b = document.createElement('button'); b.className = 'toggle'; b.textContent = label; b.addEventListener('click', onClick); viewsEl.appendChild(b); return b; };
const tWalls = toggle('Paredes completas', () => { state.cut = !state.cut; api.setCut(state.cut); sync(); });
const tNight = toggle('De noche', () => { state.night = !state.night; api.setNight(state.night); sync(); });
const tDecor = toggle('Decoración extra', () => { state.decor = !state.decor; api.setDecor(state.decor); sync(); });

function sync() {
  viewBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
  tWalls.setAttribute('aria-pressed', String(!state.cut));
  tNight.setAttribute('aria-pressed', String(state.night));
  tDecor.setAttribute('aria-pressed', String(state.decor && cur !== 'A'));
  tDecor.disabled = cur === 'A';
  tDecor.title = cur === 'A' ? 'La versión actual no tiene decoración extra' : 'Planta, lámpara y cuadro: no aparecen en las fotos';
}

async function show(key) {
  if (api) { state.pose = api.getPose(); api.destroy(); api = null; }
  cur = key;
  const v = VARIANTS[key];
  $('vTitle').textContent = v.title; $('vDesc').textContent = v.desc;
  $('vLabel').innerHTML = `<b>${key}</b> · ${v.name}`;
  try { history.replaceState(null, '', '#' + key); } catch (e) { /* el visor puede no permitirlo */ }
  try { api = await v.run(stage, { scene, state }); window.__viewer = api; }
  catch (e) { console.error(e); $('err').textContent = 'Este navegador no pudo iniciar el visor 3D.'; $('err').hidden = false; return; }
  sync();
}
const step = d => show(KEYS[(KEYS.indexOf(cur) + d + KEYS.length) % KEYS.length]);
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
const openJson = v => { $('drawer').hidden = !v; $('tJson').setAttribute('aria-expanded', String(v)); };
$('tJson').addEventListener('click', () => openJson($('drawer').hidden));
$('closeJson').addEventListener('click', () => openJson(false));

setInterval(() => {
  if (!api) return;
  const s = api.stats();
  $('stats').textContent = `${s.meshes} mallas · ${(s.tris / 1000).toFixed(1)} k triángulos · ${s.fps} fps · calidad ${s.quality}`;
}, 500);

const fromHash = location.hash.slice(1).toUpperCase();
await show(KEYS.includes(fromHash) ? fromHash : 'B');
</script>
