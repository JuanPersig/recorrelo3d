<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Departamento en 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;650&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Visor a pantalla completa: ficha del departamento arriba a la izquierda, vistas y ajustes abajo. */
:root{
  --bg:#e4e8eb; --panel:rgba(250,251,252,.88); --ink:#1d2430; --muted:#5b6573;
  --line:rgba(29,36,48,.12); --accent:#2d3a52; --accent-ink:#f4f6fa; --chip:rgba(29,36,48,.06); --warn:#9a5b13;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a21; --panel:rgba(24,30,38,.88); --ink:#e9edf2; --muted:#9aa5b3;
    --line:rgba(233,237,242,.14); --accent:#c9d5ea; --accent-ink:#141a24; --chip:rgba(233,237,242,.08); --warn:#e7b26a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a21; --panel:rgba(24,30,38,.88); --ink:#e9edf2; --muted:#9aa5b3;
  --line:rgba(233,237,242,.14); --accent:#c9d5ea; --accent-ink:#141a24; --chip:rgba(233,237,242,.08); --warn:#e7b26a; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}
.head{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));
  width:min(360px,calc(100% - 28px));border-radius:16px;padding:13px 15px 12px;display:grid;gap:7px}
.head h1{margin:0;font-size:17px;line-height:1.25;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.head p{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
details{font-size:13px;line-height:1.45}
summary{cursor:pointer;color:var(--warn);font-weight:500;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
details ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.head details p{margin-top:6px;font-size:13px}
#est:not(.dev) summary{color:var(--muted)}
.head .short,.head .about-m{display:none}
.brand{margin:0;font-size:12.5px;color:var(--muted)}
.brand a{color:var(--ink);font-weight:500;text-decoration:none;border-bottom:1px solid var(--accent)}
.stats{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.link{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--chip);border:0;border-radius:10px;padding:5px 10px;cursor:pointer;justify-self:start}
.link:hover{background:var(--line)}
.bars{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar{pointer-events:auto;display:flex;gap:6px;align-items:center;max-width:100%;overflow-x:auto;border-radius:20px;padding:6px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
/* si la barra se desplaza, se desvanece del lado donde hay más botones */
.bar.more-r{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
.bar.more-l{-webkit-mask-image:linear-gradient(to left,#000 82%,transparent);mask-image:linear-gradient(to left,#000 82%,transparent)}
.bar.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(to right,transparent,#000 18%,#000 82%,transparent)}
.bar .short{display:none}
#views{flex-wrap:wrap;justify-content:center;max-width:min(980px,100%)}
.bar button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:transparent;border:0;border-radius:14px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:var(--chip)}
.bar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar .toggle[aria-pressed="true"]{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drawer{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
  width:min(420px,calc(100% - 28px));max-height:calc(100% - 140px);border-radius:16px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.drawer header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px 8px 15px;font-weight:650;font-size:14px}
.drawer pre{margin:0;padding:0 15px 14px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--ink);min-width:0}
.hint{font-size:13px;color:var(--ink);border-radius:12px;padding:6px 12px;pointer-events:none;transition:opacity .4s;text-align:center;max-width:calc(100% - 24px)}
.hint[data-off]{opacity:0}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:560px){
  .head{padding:10px 12px}
  .head h1{font-size:15.5px}
  .head .note,.stats{display:none}
  .bar button{font-size:13.5px;padding:8px 10px}
  .bar .long,.head .long{display:none}
  .bar .short,.head .short{display:inline}
  .head .about-m{display:block}
  #views{flex-wrap:nowrap;justify-content:flex-start}
}
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>

<div id="app">
  <div id="stage"></div>
  <div class="head glass">
    <h1 id="name">Cargando…</h1>
    <p class="note" id="note"></p>
    <details id="est"><summary id="estSum">Modelo aproximado</summary><div id="estBody"></div></details>
    <div class="stats" id="stats" aria-live="off" hidden></div>
    <button class="link" id="tJson" aria-expanded="false" hidden>Ver scene.json</button>
    <p class="brand" id="brand" hidden></p>
  </div>
  <div class="drawer glass" id="drawer" hidden>
    <header><span>scene.json</span><button class="link" id="closeJson">Cerrar</button></header>
    <pre id="json"></pre>
  </div>
  <!-- los ajustes van en su propia barra: con muchas vistas la de vistas se desplaza y no deben quedar fuera de pantalla -->
  <div class="bars">
    <div class="hint glass" id="hint" data-off aria-live="polite"></div>
    <div class="bar glass" role="toolbar" aria-label="Ajustes del modelo" id="toggles"></div>
    <div class="bar glass" role="toolbar" aria-label="Vistas del modelo" id="views"></div>
  </div>
  <div class="err" id="err" hidden></div>
</div>

<script type="module">
import { start } from './engine.js';
const $ = id => document.getElementById(id);
const fail = msg => { $('err').textContent = msg; $('err').hidden = false; };

// local: visor.html?scene=/departamentos/depto2/scene.json · publicado: scene.json junto a la página
// El huésped ve el texto "about" y el aviso de modelo aproximado; con &dev (o ?dev) aparecen la nota interna, la
// lista de estimados, las estadísticas y el scene.json, para trabajar.
const params = new URLSearchParams(location.search), dev = params.has('dev');
const src = params.get('scene') ?? './scene.json';
let scene;
try { scene = await (await fetch(src)).json(); }
catch (e) { fail('No se pudo leer scene.json. Abrí el visor con el servidor local (node motor/serve.mjs).'); throw e; }

document.title = scene.name ?? document.title;
$('name').textContent = scene.name ?? 'Departamento';
const el = (tag, text) => Object.assign(document.createElement(tag), { textContent: text });
if (dev) {
  $('note').textContent = scene.note ?? '';
  $('estSum').textContent = 'Estimado sin foto';
  $('estBody').replaceChildren(el('ul'));
  $('estBody').firstChild.replaceChildren(...(scene.estimated ?? []).map(t => el('li', t)));
  $('est').hidden = !scene.estimated?.length; $('est').classList.add('dev');
  $('json').textContent = JSON.stringify(scene, null, 2);
  $('stats').hidden = $('tJson').hidden = false;
} else {
  // en pantallas angostas la descripción no entra en la ficha: va dentro del desplegable, que pasa a "Más información"
  $('note').textContent = scene.about ?? '';
  if (scene.about) $('estSum').replaceChildren(Object.assign(el('span', 'Modelo aproximado'), { className: 'long' }), Object.assign(el('span', 'Más información'), { className: 'short' }));
  $('estBody').replaceChildren(...(scene.about ? [Object.assign(el('p', scene.about), { className: 'about-m' })] : []),
    el('p', scene.disclaimer ?? 'Modelo 3D hecho a partir de las fotos del anuncio. Las medidas son aproximadas y lo que no se ve en las fotos está representado de forma simple.'));
}

// marca blanca: "brand": { "name", "url"?, "color"? } muestra quién presenta el departamento y usa su color en los
// botones elegidos (con el texto claro u oscuro según el color)
if (scene.brand?.name) {
  const b = scene.brand, a = b.url ? Object.assign(el('a', b.name), { href: b.url, target: '_blank', rel: 'noopener' }) : el('strong', b.name);
  $('brand').replaceChildren('Presentado por ', a); $('brand').hidden = false;
}
if (/^#[0-9a-f]{6}$/i.test(scene.brand?.color ?? '')) {
  const c = scene.brand.color, [r, g, bl] = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255);
  const ink = 0.2126 * r + 0.7152 * g + 0.0722 * bl > 0.55 ? '#141a24' : '#f4f6fa';
  document.documentElement.style.setProperty('--accent', c); document.documentElement.style.setProperty('--accent-ink', ink);
}

// link directo a una vista: ?vista=<clave> (o #<clave>) y &noche. Al cambiar de vista se actualiza el #, así el link
// de la barra de direcciones lleva a lo que se está viendo
const keys = Object.keys(scene.views), asked = params.get('vista') ?? decodeURIComponent(location.hash.slice(1));
const first = keys.includes(asked) ? asked : keys[0];
const state = { view: first, cut: scene.views[first].cut, night: params.has('noche'), decor: true, pose: null, preset: 'premium' };
const remember = key => { try { history.replaceState(null, '', `#${encodeURIComponent(key)}`); } catch {} };
let api = null;

const bar = $('views');
const viewBtns = Object.entries(scene.views).map(([key, v]) => {
  const b = document.createElement('button'); b.textContent = v.name; b.dataset.view = key;
  b.addEventListener('click', () => { state.view = key; state.cut = v.cut; api.setCut(v.cut); api.go(key); sync(); hint(v.cut); remember(key); });
  bar.appendChild(b); return b;
});
// cada ajuste lleva una etiqueta corta para pantallas angostas, así la barra entra entera en un celular
const toggle = (label, short, onClick) => {
  const b = document.createElement('button'); b.className = 'toggle'; b.setAttribute('aria-label', label);
  b.append(Object.assign(document.createElement('span'), { className: 'long', textContent: label }), Object.assign(document.createElement('span'), { className: 'short', textContent: short }));
  b.addEventListener('click', onClick); $('toggles').appendChild(b); return b;
};
const tWalls = toggle('Con techo', 'Techo', () => { state.cut = !state.cut; api.setCut(state.cut); sync(); });
const tNight = toggle('De noche', 'Noche', () => { state.night = !state.night; api.setNight(state.night); sync(); });
const tClay = toggle('Estilo maqueta', 'Maqueta', () => { state.preset = state.preset === 'clay' ? 'premium' : 'clay'; boot(); });
const tDecor = toggle('Decoración extra', 'Decoración', () => { state.decor = !state.decor; api.setDecor(state.decor); sync(); });

// barras que se desplazan: se marca el lado con más botones y la vista elegida se lleva al centro
const edges = b => { b.classList.toggle('more-l', b.scrollLeft > 2); b.classList.toggle('more-r', b.scrollLeft + b.clientWidth < b.scrollWidth - 2); };
for (const b of [bar, $('toggles')]) b.addEventListener('scroll', () => edges(b), { passive: true });
addEventListener('resize', () => { edges(bar); edges($('toggles')); });
// el desplazamiento se anima a mano: el "smooth" del navegador no siempre corre en vistas embebidas
let revealRaf = 0;
function reveal(btn) {
  if (bar.scrollWidth <= bar.clientWidth) return;
  const r = btn.getBoundingClientRect(), R = bar.getBoundingClientRect(), from = bar.scrollLeft;
  const to = Math.max(0, Math.min(bar.scrollWidth - bar.clientWidth, from + r.left + r.width / 2 - (R.left + R.width / 2)));
  cancelAnimationFrame(revealRaf);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { bar.scrollLeft = to; return; }
  const t0 = performance.now(), step = now => {
    const k = Math.min(1, (now - t0) / 320); bar.scrollLeft = from + (to - from) * (1 - Math.pow(1 - k, 3));
    if (k < 1) revealRaf = requestAnimationFrame(step);
  };
  revealRaf = requestAnimationFrame(step);
}

// cómo moverse: adentro se camina, en las vistas desde arriba se gira; se muestra unos segundos al cambiar de vista
const touchUI = matchMedia('(pointer: coarse)').matches;
let hintT = 0;
function hint(aerial) {
  $('hint').textContent = aerial
    ? (touchUI ? 'Arrastrá para girar · pellizcá para acercar · dos dedos para desplazar' : 'Arrastrá para girar · rueda para acercar · clic derecho para desplazar')
    : (touchUI ? 'Arrastrá para mirar · pellizcá para acercar · tocá el piso para ir ahí'
      : 'Arrastrá para mirar · rueda para acercar · WASD o flechas para caminar · doble clic en el piso para ir ahí');
  delete $('hint').dataset.off; clearTimeout(hintT); hintT = setTimeout(() => { $('hint').dataset.off = ''; }, 5000);
}
function sync() {
  viewBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
  tWalls.setAttribute('aria-pressed', String(!state.cut));
  tNight.setAttribute('aria-pressed', String(state.night));
  tClay.setAttribute('aria-pressed', String(state.preset === 'clay'));
  tDecor.setAttribute('aria-pressed', String(state.decor));
  tDecor.hidden = !api?.hasDecor;
  const on = viewBtns.find(b => b.dataset.view === state.view);
  if (on) reveal(on);
  edges(bar); edges($('toggles'));
}
// cambiar de estilo rearma la escena con otros materiales, manteniendo la cámara
async function boot() {
  if (api) { state.pose = api.getPose(); api.destroy(); api = null; }
  try { api = await start($('stage'), { scene, state, preset: state.preset, base: new URL('.', new URL(src, location.href)).href }); window.__viewer = api; }
  catch (e) { console.error(e); fail('Este navegador no pudo iniciar el visor 3D.'); return; }
  sync();
}

const openJson = v => { $('drawer').hidden = !v; $('tJson').setAttribute('aria-expanded', String(v)); };
$('tJson').addEventListener('click', () => openJson($('drawer').hidden));
$('closeJson').addEventListener('click', () => openJson(false));
if (dev) setInterval(() => {
  if (!api) return;
  const s = api.stats();
  $('stats').textContent = `${s.meshes} mallas · ${(s.tris / 1000).toFixed(1)} k triángulos · ${s.fps} fps · calidad ${s.quality}`;
}, 500);

await boot();
hint(scene.views[first].cut);
</script>
